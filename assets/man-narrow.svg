<rect x=".5" y=".5" width="432" height="1111" rx="9" fill="#0d1117" stroke="#30363d"/>
<path d="M.5 34V9.5a9 9 0 0 1 9-9H423.5a9 9 0 0 1 9 9V34z" fill="#161b22" stroke="#30363d"/>
<circle cx="18" cy="17" r="5.5" fill="#ff5f57"/><circle cx="36" cy="17" r="5.5" fill="#febc2e"/><circle cx="54" cy="17" r="5.5" fill="#28c840"/>
<text x="216.5" y="21" text-anchor="middle" class="title">man leandro</text>
<text x="22" y="68" xml:space="preserve" textLength="388.7">LEANDRO(1)       User Commands      LEANDRO(1)</text>
<text x="22" y="108" xml:space="preserve" textLength="33.8"><tspan class="b">NAME</tspan></text>
<text x="22" y="128" xml:space="preserve" textLength="346.4">     leandro - backend engineer, measures</text>
<text x="22" y="148" xml:space="preserve" textLength="92.9">     things</text>
<text x="22" y="188" xml:space="preserve" textLength="67.6"><tspan class="b">SYNOPSIS</tspan></text>
<text x="22" y="208" xml:space="preserve" textLength="194.3">     <tspan class="b">leandro</tspan> [<tspan class="u">idea</tspan> ...]</text>
<text x="22" y="248" xml:space="preserve" textLength="92.9"><tspan class="b">DESCRIPTION</tspan></text>
<text x="22" y="268" xml:space="preserve" textLength="371.8">     Writes backend code at Luzia, mostly in</text>
<text x="22" y="288" xml:space="preserve" textLength="101.4">     Python.</text>
<text x="22" y="328" xml:space="preserve" textLength="363.3">     Given an <tspan class="u">idea</tspan>, <tspan class="b">leandro</tspan> instruments it,</text>
<text x="22" y="348" xml:space="preserve" textLength="380.2">     waits a few weeks and reports whether it</text>
<text x="22" y="368" xml:space="preserve" textLength="388.7">     was worth doing.  With no arguments, adds</text>
<text x="22" y="388" xml:space="preserve" textLength="287.3">     a sensor to something nearby.</text>
<text x="22" y="428" xml:space="preserve" textLength="92.9"><tspan class="b">EXIT</tspan> <tspan class="b">STATUS</tspan></text>
<text x="22" y="448" xml:space="preserve" textLength="287.3">     <tspan class="b">0</tspan>      The idea was worth it.</text>
<text x="22" y="488" xml:space="preserve" textLength="363.3">     <tspan class="b">1</tspan>      The idea was not worth it and a</text>
<text x="22" y="508" xml:space="preserve" textLength="371.8">            graph was produced.  This is the</text>
<text x="22" y="528" xml:space="preserve" textLength="371.8">            common case and is not an error.</text>
<text x="22" y="568" xml:space="preserve" textLength="92.9"><tspan class="b">ENVIRONMENT</tspan></text>
<text x="22" y="588" xml:space="preserve" textLength="346.4">     <tspan class="b">HOME</tspan>   A village in Alicante, Spain.</text>
<text x="22" y="628" xml:space="preserve" textLength="219.7">     <tspan class="b">TZ</tspan>     Europe/Madrid.</text>
<text x="22" y="668" xml:space="preserve" textLength="101.4">     <tspan class="b">WEATHER</tspan></text>
<text x="22" y="688" xml:space="preserve" textLength="295.8">            Consulted before flying</text>
<text x="22" y="708" xml:space="preserve" textLength="380.2">            ultralights.  If unset, no flight</text>
<text x="22" y="728" xml:space="preserve" textLength="211.2">            is attempted.</text>
<text x="22" y="768" xml:space="preserve" textLength="42.2"><tspan class="b">FILES</tspan></text>
<text x="22" y="788" xml:space="preserve" textLength="118.3">     <tspan class="u">~/homelab</tspan></text>
<text x="22" y="808" xml:space="preserve" textLength="346.4">            A small datacenter&#x27;s worth of</text>
<text x="22" y="828" xml:space="preserve" textLength="253.5">            hardware, at home.</text>
<text x="22" y="868" xml:space="preserve" textLength="33.8"><tspan class="b">BUGS</tspan></text>
<text x="22" y="888" xml:space="preserve" textLength="380.2">     On call for everything in FILES, unpaid.</text>
<text x="22" y="928" xml:space="preserve" textLength="380.2">     The church clock next door runs about 15</text>
<text x="22" y="948" xml:space="preserve" textLength="363.3">     seconds fast.  This has been measured.</text>
<text x="22" y="988" xml:space="preserve" textLength="67.6"><tspan class="b">SEE</tspan> <tspan class="b">ALSO</tspan></text>
<text x="22" y="1008" xml:space="preserve" textLength="194.3">     https://albero.dev</text>
<text x="22" y="1048" xml:space="preserve" textLength="388.7">Alicante, Spain   2026-11-26        LEANDRO(1)</text>
<rect x="22" y="1074" width="371.8" height="18" fill="#c9d1d9"/>
<text x="22" y="1088" class="inv" xml:space="preserve" textLength="371.8"> Manual page leandro(1) lines 1-50/50 (END) </text>
<rect class="cur" x="396.8" y="1074" width="8.45" height="18" fill="#c9d1d9"/>
</svg>
