<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 433 1112" width="433" height="1112" role="img" aria-label="Terminal window showing the manual page leandro(1)">
<style>text{font:14px ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;fill:#c9d1d9;white-space:pre}.b{font-weight:700;fill:#fff}.u{text-decoration:underline;fill:#e3b341}.title{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#8b949e}.inv{fill:#0d1117}.in{width:calc(100% - 2px)}.cur{animation:k 1.1s steps(1) infinite}@keyframes k{50%{opacity:0}}@media (prefers-reduced-motion:reduce){.cur{animation:none}}</style>
<rect width="100%" height="1112" rx="9" fill="#30363d"/>
<rect class="in" x="1" y="1" width="99.7%" height="1110" rx="8" fill="#0d1117"/>
<rect class="in" x="1" y="1" width="99.7%" height="34" rx="8" fill="#161b22"/>
<rect class="in" x="1" y="25" width="99.7%" height="10" fill="#161b22"/>
<rect class="in" x="1" y="34" width="99.7%" height="1" fill="#30363d"/>
<circle cx="18" cy="17" r="5.5" fill="#ff5f57"/><circle cx="36" cy="17" r="5.5" fill="#febc2e"/><circle cx="54" cy="17" r="5.5" fill="#28c840"/>
<text x="50%" y="21" text-anchor="middle" class="title">man leandro</text>
<text x="22.0" y="68" xml:space="preserve" textLength="388.7">LEANDRO(1)       User Commands      LEANDRO(1)</text>
<text x="22.0" y="108" class="b" xml:space="preserve" textLength="33.8">NAME</text>
<text x="64.2" y="128" xml:space="preserve" textLength="304.2">leandro - backend engineer, measures</text>
<text x="64.2" y="148" xml:space="preserve" textLength="50.7">things</text>
<text x="22.0" y="188" class="b" xml:space="preserve" textLength="67.6">SYNOPSIS</text>
<text x="64.2" y="208" class="b" xml:space="preserve" textLength="59.1">leandro</text>
<text x="131.8" y="208" xml:space="preserve" textLength="8.4">[</text>
<text x="140.3" y="208" class="u" xml:space="preserve" textLength="33.8">idea</text>
<text x="182.5" y="208" xml:space="preserve" textLength="33.8">...]</text>
<text x="22.0" y="248" class="b" xml:space="preserve" textLength="92.9">DESCRIPTION</text>
<text x="64.2" y="268" xml:space="preserve" textLength="329.5">Writes backend code at Luzia, mostly in</text>
<text x="64.2" y="288" xml:space="preserve" textLength="59.1">Python.</text>
<text x="64.2" y="328" xml:space="preserve" textLength="67.6">Given an</text>
<text x="140.3" y="328" class="u" xml:space="preserve" textLength="33.8">idea</text>
<text x="174.1" y="328" xml:space="preserve" textLength="8.4">,</text>
<text x="191.0" y="328" class="b" xml:space="preserve" textLength="59.1">leandro</text>
<text x="258.6" y="328" xml:space="preserve" textLength="126.7">instruments it,</text>
<text x="64.2" y="348" xml:space="preserve" textLength="338.0">waits a few weeks and reports whether it</text>
<text x="64.2" y="368" xml:space="preserve" textLength="346.4">was worth doing.  With no arguments, adds</text>
<text x="64.2" y="388" xml:space="preserve" textLength="245.0">a sensor to something nearby.</text>
<text x="22.0" y="428" class="b" xml:space="preserve" textLength="33.8">EXIT</text>
<text x="64.2" y="428" class="b" xml:space="preserve" textLength="50.7">STATUS</text>
<text x="64.2" y="448" class="b" xml:space="preserve" textLength="8.4">0</text>
<text x="123.4" y="448" xml:space="preserve" textLength="185.9">The idea was worth it.</text>
<text x="64.2" y="488" class="b" xml:space="preserve" textLength="8.4">1</text>
<text x="123.4" y="488" xml:space="preserve" textLength="261.9">The idea was not worth it and a</text>
<text x="123.4" y="508" xml:space="preserve" textLength="270.4">graph was produced.  This is the</text>
<text x="123.4" y="528" xml:space="preserve" textLength="270.4">common case and is not an error.</text>
<text x="22.0" y="568" class="b" xml:space="preserve" textLength="92.9">ENVIRONMENT</text>
<text x="64.2" y="588" class="b" xml:space="preserve" textLength="33.8">HOME</text>
<text x="123.4" y="588" xml:space="preserve" textLength="245.0">A village in Alicante, Spain.</text>
<text x="64.2" y="628" class="b" xml:space="preserve" textLength="16.9">TZ</text>
<text x="123.4" y="628" xml:space="preserve" textLength="118.3">Europe/Madrid.</text>
<text x="64.2" y="668" class="b" xml:space="preserve" textLength="59.1">WEATHER</text>
<text x="123.4" y="688" xml:space="preserve" textLength="194.3">Consulted before flying</text>
<text x="123.4" y="708" xml:space="preserve" textLength="278.8">ultralights.  If unset, no flight</text>
<text x="123.4" y="728" xml:space="preserve" textLength="109.8">is attempted.</text>
<text x="22.0" y="768" class="b" xml:space="preserve" textLength="42.2">FILES</text>
<text x="64.2" y="788" class="u" xml:space="preserve" textLength="76.0">~/homelab</text>
<text x="123.4" y="808" xml:space="preserve" textLength="245.0">A small datacenter&#x27;s worth of</text>
<text x="123.4" y="828" xml:space="preserve" textLength="152.1">hardware, at home.</text>
<text x="22.0" y="868" class="b" xml:space="preserve" textLength="33.8">BUGS</text>
<text x="64.2" y="888" xml:space="preserve" textLength="338.0">On call for everything in FILES, unpaid.</text>
<text x="64.2" y="928" xml:space="preserve" textLength="338.0">The church clock next door runs about 15</text>
<text x="64.2" y="948" xml:space="preserve" textLength="321.1">seconds fast.  This has been measured.</text>
<text x="22.0" y="988" class="b" xml:space="preserve" textLength="25.3">SEE</text>
<text x="55.8" y="988" class="b" xml:space="preserve" textLength="33.8">ALSO</text>
<text x="64.2" y="1008" xml:space="preserve" textLength="152.1">https://albero.dev</text>
<text x="22.0" y="1048" xml:space="preserve" textLength="388.7">Alicante, Spain   2026-11-26        LEANDRO(1)</text>
<rect x="22" y="1074" width="371.8" height="18" fill="#c9d1d9"/>
<text x="22" y="1088" class="inv" xml:space="preserve" textLength="371.8"> Manual page leandro(1) lines 1-50/50 (END) </text>
<rect class="cur" x="396.8" y="1074" width="8.4" height="18" fill="#c9d1d9"/>
</svg>
