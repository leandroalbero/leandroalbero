<circle cx="18" cy="17" r="5.5" fill="#ff5f57"/><circle cx="36" cy="17" r="5.5" fill="#febc2e"/><circle cx="54" cy="17" r="5.5" fill="#28c840"/>
<text x="50%" y="21" text-anchor="middle" class="title">man leandro</text>
<text x="22" y="66">LEANDRO(1)</text><text x="50%" y="66" text-anchor="middle">User Commands</text><text x="100%" dx="-22" y="66" text-anchor="end">LEANDRO(1)</text>
<text x="22" y="100" xml:space="preserve" textLength="29.0"><tspan class="b">NAME</tspan></text>
<text x="22" y="117" xml:space="preserve" textLength="347.7">     leandro - backend engineer, measures things</text>
<text x="22" y="151" xml:space="preserve" textLength="57.9"><tspan class="b">SYNOPSIS</tspan></text>
<text x="22" y="168" xml:space="preserve" textLength="166.6">     <tspan class="b">leandro</tspan> [<tspan class="u">idea</tspan> ...]</text>
<text x="22" y="202" xml:space="preserve" textLength="79.7"><tspan class="b">DESCRIPTION</tspan></text>
<text x="22" y="219" xml:space="preserve" textLength="318.7">     Writes backend code at Luzia, mostly in</text>
<text x="22" y="236" xml:space="preserve" textLength="86.9">     Python.</text>
<text x="22" y="270" xml:space="preserve" textLength="354.9">     Given an <tspan class="u">idea</tspan>, <tspan class="b">leandro</tspan> instruments it, waits</text>
<text x="22" y="287" xml:space="preserve" textLength="354.9">     a few weeks and reports whether it was worth</text>
<text x="22" y="304" xml:space="preserve" textLength="347.7">     doing.  With no arguments, adds a sensor to</text>
<text x="22" y="321" xml:space="preserve" textLength="159.3">     something nearby.</text>
<text x="22" y="355" xml:space="preserve" textLength="79.7"><tspan class="b">EXIT</tspan> <tspan class="b">STATUS</tspan></text>
<text x="22" y="372" xml:space="preserve" textLength="246.3">     <tspan class="b">0</tspan>      The idea was worth it.</text>
<text x="22" y="406" xml:space="preserve" textLength="354.9">     <tspan class="b">1</tspan>      The idea was not worth it and a graph</text>
<text x="22" y="423" xml:space="preserve" textLength="362.1">            was produced.  This is the common case</text>
<text x="22" y="440" xml:space="preserve" textLength="231.8">            and is not an error.</text>
<text x="22" y="474" xml:space="preserve" textLength="79.7"><tspan class="b">ENVIRONMENT</tspan></text>
<text x="22" y="491" xml:space="preserve" textLength="297.0">     <tspan class="b">HOME</tspan>   A village in Alicante, Spain.</text>
<text x="22" y="525" xml:space="preserve" textLength="188.3">     <tspan class="b">TZ</tspan>     Europe/Madrid.</text>
<text x="22" y="559" xml:space="preserve" textLength="86.9">     <tspan class="b">WEATHER</tspan></text>
<text x="22" y="576" xml:space="preserve" textLength="347.7">            Consulted before flying ultralights.</text>
<text x="22" y="593" xml:space="preserve" textLength="325.9">            If unset, no flight is attempted.</text>
<text x="22" y="627" xml:space="preserve" textLength="36.2"><tspan class="b">FILES</tspan></text>
<text x="22" y="644" xml:space="preserve" textLength="101.4">     <tspan class="u">~/homelab</tspan></text>
<text x="22" y="661" xml:space="preserve" textLength="297.0">            A small datacenter&#x27;s worth of</text>
<text x="22" y="678" xml:space="preserve" textLength="217.3">            hardware, at home.</text>
<text x="22" y="712" xml:space="preserve" textLength="29.0"><tspan class="b">BUGS</tspan></text>
<text x="22" y="729" xml:space="preserve" textLength="325.9">     On call for everything in FILES, unpaid.</text>
<text x="22" y="763" xml:space="preserve" textLength="325.9">     The church clock next door runs about 15</text>
<text x="22" y="780" xml:space="preserve" textLength="311.4">     seconds fast.  This has been measured.</text>
<text x="22" y="814" xml:space="preserve" textLength="57.9"><tspan class="b">SEE</tspan> <tspan class="b">ALSO</tspan></text>
<text x="22" y="831" xml:space="preserve" textLength="166.6">     https://albero.dev</text>
<text x="22" y="865">Alicante, Spain</text><text x="50%" y="865" text-anchor="middle">2026-11-26</text><text x="100%" dx="-22" y="865" text-anchor="end">LEANDRO(1)</text>
<rect x="22" y="887" width="318.7" height="15" fill="#c9d1d9"/>
<text x="22" y="899" class="inv" xml:space="preserve" textLength="318.7"> Manual page leandro(1) lines 1-48/48 (END) </text>
<rect class="cur" x="343.7" y="887" width="7.2" height="15" fill="#c9d1d9"/>
</svg>
