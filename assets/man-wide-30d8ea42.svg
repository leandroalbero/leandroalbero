<rect class="in" x="1" y="1" width="99.7%" height="34" rx="8" fill="#161b22"/>
<rect class="in" x="1" y="25" width="99.7%" height="10" fill="#161b22"/>
<rect class="in" x="1" y="34" width="99.7%" height="1" fill="#30363d"/>
<circle cx="18" cy="17" r="5.5" fill="#ff5f57"/><circle cx="36" cy="17" r="5.5" fill="#febc2e"/><circle cx="54" cy="17" r="5.5" fill="#28c840"/>
<text x="50%" y="21" text-anchor="middle" class="title">man leandro</text>
<text x="22" y="66">LEANDRO(1)</text><text x="50%" y="66" text-anchor="middle">User Commands</text><text x="100%" dx="-22" y="66" text-anchor="end">LEANDRO(1)</text>
<text x="22.0" y="100" class="b" xml:space="preserve" textLength="29.0">NAME</text>
<text x="58.2" y="117" xml:space="preserve" textLength="311.4">leandro - backend engineer, measures things</text>
<text x="22.0" y="151" class="b" xml:space="preserve" textLength="57.9">SYNOPSIS</text>
<text x="58.2" y="168" class="b" xml:space="preserve" textLength="50.7">leandro</text>
<text x="116.2" y="168" xml:space="preserve" textLength="7.2">[</text>
<text x="123.4" y="168" class="u" xml:space="preserve" textLength="29.0">idea</text>
<text x="159.6" y="168" xml:space="preserve" textLength="29.0">...]</text>
<text x="22.0" y="202" class="b" xml:space="preserve" textLength="79.7">DESCRIPTION</text>
<text x="58.2" y="219" xml:space="preserve" textLength="340.4">Writes backend code at Luzia, mostly in Python.</text>
<text x="58.2" y="253" xml:space="preserve" textLength="57.9">Given an</text>
<text x="123.4" y="253" class="u" xml:space="preserve" textLength="29.0">idea</text>
<text x="152.4" y="253" xml:space="preserve" textLength="7.2">,</text>
<text x="166.9" y="253" class="b" xml:space="preserve" textLength="50.7">leandro</text>
<text x="224.8" y="253" xml:space="preserve" textLength="325.9">instruments it, waits a few weeks and reports</text>
<text x="58.2" y="270" xml:space="preserve" textLength="463.5">whether it was worth doing.  With no arguments, adds a sensor to</text>
<text x="58.2" y="287" xml:space="preserve" textLength="123.1">something nearby.</text>
<text x="22.0" y="321" class="b" xml:space="preserve" textLength="29.0">EXIT</text>
<text x="58.2" y="321" class="b" xml:space="preserve" textLength="43.5">STATUS</text>
<text x="58.2" y="338" class="b" xml:space="preserve" textLength="7.2">0</text>
<text x="108.9" y="338" xml:space="preserve" textLength="159.3">The idea was worth it.</text>
<text x="58.2" y="372" class="b" xml:space="preserve" textLength="7.2">1</text>
<text x="108.9" y="372" xml:space="preserve" textLength="463.5">The idea was not worth it and a graph was produced.  This is the</text>
<text x="108.9" y="389" xml:space="preserve" textLength="231.8">common case and is not an error.</text>
<text x="22.0" y="423" class="b" xml:space="preserve" textLength="79.7">ENVIRONMENT</text>
<text x="58.2" y="440" class="b" xml:space="preserve" textLength="29.0">HOME</text>
<text x="108.9" y="440" xml:space="preserve" textLength="210.0">A village in Alicante, Spain.</text>
<text x="58.2" y="474" class="b" xml:space="preserve" textLength="14.5">TZ</text>
<text x="108.9" y="474" xml:space="preserve" textLength="101.4">Europe/Madrid.</text>
<text x="58.2" y="508" class="b" xml:space="preserve" textLength="50.7">WEATHER</text>
<text x="108.9" y="525" xml:space="preserve" textLength="434.6">Consulted before flying ultralights.  If unset, no flight is</text>
<text x="108.9" y="542" xml:space="preserve" textLength="72.4">attempted.</text>
<text x="22.0" y="576" class="b" xml:space="preserve" textLength="36.2">FILES</text>
<text x="58.2" y="593" class="u" xml:space="preserve" textLength="65.2">~/homelab</text>
<text x="108.9" y="610" xml:space="preserve" textLength="347.7">A small datacenter&#x27;s worth of hardware, at home.</text>
<text x="22.0" y="644" class="b" xml:space="preserve" textLength="29.0">BUGS</text>
<text x="58.2" y="661" xml:space="preserve" textLength="289.7">On call for everything in FILES, unpaid.</text>
<text x="58.2" y="695" xml:space="preserve" textLength="499.8">The church clock next door runs about 15 seconds fast.  This has been</text>
<text x="58.2" y="712" xml:space="preserve" textLength="65.2">measured.</text>
<text x="22.0" y="746" class="b" xml:space="preserve" textLength="21.7">SEE</text>
<text x="51.0" y="746" class="b" xml:space="preserve" textLength="29.0">ALSO</text>
<text x="58.2" y="763" xml:space="preserve" textLength="130.4">https://albero.dev</text>
<text x="22" y="797">Alicante, Spain</text><text x="50%" y="797" text-anchor="middle">2026-11-26</text><text x="100%" dx="-22" y="797" text-anchor="end">LEANDRO(1)</text>
<rect x="22" y="819" width="318.7" height="15" fill="#c9d1d9"/>
<text x="22" y="831" class="inv" xml:space="preserve" textLength="318.7"> Manual page leandro(1) lines 1-44/44 (END) </text>
<rect class="cur" x="343.7" y="819" width="7.2" height="15" fill="#c9d1d9"/>
