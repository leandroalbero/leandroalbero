<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="922" role="img" aria-label="Terminal window showing the manual page leandro(1)">
<style>text{font:12px ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;fill:#c9d1d9;white-space:pre}.b{font-weight:700;fill:#fff}.u{text-decoration:underline;fill:#e3b341}.title{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#8b949e}.inv{fill:#0d1117}.in{width:calc(100% - 2px)}.cur{animation:k 1.1s steps(1) infinite}@keyframes k{50%{opacity:0}}@media (prefers-reduced-motion:reduce){.cur{animation:none}}</style>
<rect width="100%" height="922" rx="9" fill="#30363d"/>
<rect class="in" x="1" y="1" width="99.7%" height="920" rx="8" fill="#0d1117"/>
<rect class="in" x="1" y="1" width="99.7%" height="34" rx="8" fill="#161b22"/>
<rect class="in" x="1" y="25" width="99.7%" height="10" fill="#161b22"/>
<rect class="in" x="1" y="34" width="99.7%" height="1" fill="#30363d"/>
<circle cx="18" cy="17" r="5.5" fill="#ff5f57"/><circle cx="36" cy="17" r="5.5" fill="#febc2e"/><circle cx="54" cy="17" r="5.5" fill="#28c840"/>
<text x="50%" y="21" text-anchor="middle" class="title">man leandro</text>
<text x="22" y="66">LEANDRO(1)</text><text x="50%" y="66" text-anchor="middle">User Commands</text><text x="100%" dx="-22" y="66" text-anchor="end">LEANDRO(1)</text>
<text x="22.0" y="100" class="b" xml:space="preserve" textLength="29.0">NAME</text>
<text x="58.2" y="117" xml:space="preserve" textLength="311.4">leandro - backend engineer, measures things</text>
<text x="22.0" y="151" class="b" xml:space="preserve" textLength="57.9">SYNOPSIS</text>
<text x="58.2" y="168" class="b" xml:space="preserve" textLength="50.7">leandro</text>
<text x="116.2" y="168" xml:space="preserve" textLength="7.2">[</text>
<text x="123.4" y="168" class="u" xml:space="preserve" textLength="29.0">idea</text>
<text x="159.6" y="168" xml:space="preserve" textLength="29.0">...]</text>
<text x="22.0" y="202" class="b" xml:space="preserve" textLength="79.7">DESCRIPTION</text>
<text x="58.2" y="219" xml:space="preserve" textLength="282.5">Writes backend code at Luzia, mostly in</text>
<text x="58.2" y="236" xml:space="preserve" textLength="50.7">Python.</text>
<text x="58.2" y="270" xml:space="preserve" textLength="57.9">Given an</text>
<text x="123.4" y="270" class="u" xml:space="preserve" textLength="29.0">idea</text>
<text x="152.4" y="270" xml:space="preserve" textLength="7.2">,</text>
<text x="166.9" y="270" class="b" xml:space="preserve" textLength="50.7">leandro</text>
<text x="224.8" y="270" xml:space="preserve" textLength="152.1">instruments it, waits</text>
<text x="58.2" y="287" xml:space="preserve" textLength="318.7">a few weeks and reports whether it was worth</text>
<text x="58.2" y="304" xml:space="preserve" textLength="311.4">doing.  With no arguments, adds a sensor to</text>
<text x="58.2" y="321" xml:space="preserve" textLength="123.1">something nearby.</text>
<text x="22.0" y="355" class="b" xml:space="preserve" textLength="29.0">EXIT</text>
<text x="58.2" y="355" class="b" xml:space="preserve" textLength="43.5">STATUS</text>
<text x="58.2" y="372" class="b" xml:space="preserve" textLength="7.2">0</text>
<text x="108.9" y="372" xml:space="preserve" textLength="159.3">The idea was worth it.</text>
<text x="58.2" y="406" class="b" xml:space="preserve" textLength="7.2">1</text>
<text x="108.9" y="406" xml:space="preserve" textLength="268.0">The idea was not worth it and a graph</text>
<text x="108.9" y="423" xml:space="preserve" textLength="275.2">was produced.  This is the common case</text>
<text x="108.9" y="440" xml:space="preserve" textLength="144.9">and is not an error.</text>
<text x="22.0" y="474" class="b" xml:space="preserve" textLength="79.7">ENVIRONMENT</text>
<text x="58.2" y="491" class="b" xml:space="preserve" textLength="29.0">HOME</text>
<text x="108.9" y="491" xml:space="preserve" textLength="210.0">A village in Alicante, Spain.</text>
<text x="58.2" y="525" class="b" xml:space="preserve" textLength="14.5">TZ</text>
<text x="108.9" y="525" xml:space="preserve" textLength="101.4">Europe/Madrid.</text>
<text x="58.2" y="559" class="b" xml:space="preserve" textLength="50.7">WEATHER</text>
<text x="108.9" y="576" xml:space="preserve" textLength="260.7">Consulted before flying ultralights.</text>
<text x="108.9" y="593" xml:space="preserve" textLength="239.0">If unset, no flight is attempted.</text>
<text x="22.0" y="627" class="b" xml:space="preserve" textLength="36.2">FILES</text>
<text x="58.2" y="644" class="u" xml:space="preserve" textLength="65.2">~/homelab</text>
<text x="108.9" y="661" xml:space="preserve" textLength="210.0">A small datacenter&#x27;s worth of</text>
<text x="108.9" y="678" xml:space="preserve" textLength="130.4">hardware, at home.</text>
<text x="22.0" y="712" class="b" xml:space="preserve" textLength="29.0">BUGS</text>
<text x="58.2" y="729" xml:space="preserve" textLength="289.7">On call for everything in FILES, unpaid.</text>
<text x="58.2" y="763" xml:space="preserve" textLength="289.7">The church clock next door runs about 15</text>
<text x="58.2" y="780" xml:space="preserve" textLength="275.2">seconds fast.  This has been measured.</text>
<text x="22.0" y="814" class="b" xml:space="preserve" textLength="21.7">SEE</text>
<text x="51.0" y="814" class="b" xml:space="preserve" textLength="29.0">ALSO</text>
<text x="58.2" y="831" xml:space="preserve" textLength="130.4">https://albero.dev</text>
<text x="22" y="865">Alicante, Spain</text><text x="50%" y="865" text-anchor="middle">2026-11-26</text><text x="100%" dx="-22" y="865" text-anchor="end">LEANDRO(1)</text>
<rect x="22" y="887" width="318.7" height="15" fill="#c9d1d9"/>
<text x="22" y="899" class="inv" xml:space="preserve" textLength="318.7"> Manual page leandro(1) lines 1-48/48 (END) </text>
<rect class="cur" x="343.7" y="887" width="7.2" height="15" fill="#c9d1d9"/>
</svg>
