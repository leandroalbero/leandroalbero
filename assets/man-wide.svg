<rect x=".5" y=".5" width="719" height="991" rx="9" fill="#0d1117" stroke="#30363d"/>
<path d="M.5 34V9.5a9 9 0 0 1 9-9H710.5a9 9 0 0 1 9 9V34z" fill="#161b22" stroke="#30363d"/>
<circle cx="18" cy="17" r="5.5" fill="#ff5f57"/><circle cx="36" cy="17" r="5.5" fill="#febc2e"/><circle cx="54" cy="17" r="5.5" fill="#28c840"/>
<text x="360.0" y="21" text-anchor="middle" class="title">man leandro</text>
<text x="22" y="68" xml:space="preserve" textLength="676.0">LEANDRO(1)                        User Commands                       LEANDRO(1)</text>
<text x="22" y="108" xml:space="preserve" textLength="33.8"><tspan class="b">NAME</tspan></text>
<text x="22" y="128" xml:space="preserve" textLength="405.6">     leandro - backend engineer, measures things</text>
<text x="22" y="168" xml:space="preserve" textLength="67.6"><tspan class="b">SYNOPSIS</tspan></text>
<text x="22" y="188" xml:space="preserve" textLength="194.3">     <tspan class="b">leandro</tspan> [<tspan class="u">idea</tspan> ...]</text>
<text x="22" y="228" xml:space="preserve" textLength="92.9"><tspan class="b">DESCRIPTION</tspan></text>
<text x="22" y="248" xml:space="preserve" textLength="439.4">     Writes backend code at Luzia, mostly in Python.</text>
<text x="22" y="288" xml:space="preserve" textLength="616.8">     Given an <tspan class="u">idea</tspan>, <tspan class="b">leandro</tspan> instruments it, waits a few weeks and reports</text>
<text x="22" y="308" xml:space="preserve" textLength="667.5">     whether it was worth doing.  With no arguments, adds a sensor to something</text>
<text x="22" y="328" xml:space="preserve" textLength="101.4">     nearby.</text>
<text x="22" y="368" xml:space="preserve" textLength="92.9"><tspan class="b">EXIT</tspan> <tspan class="b">STATUS</tspan></text>
<text x="22" y="388" xml:space="preserve" textLength="287.3">     <tspan class="b">0</tspan>      The idea was worth it.</text>
<text x="22" y="428" xml:space="preserve" textLength="642.2">     <tspan class="b">1</tspan>      The idea was not worth it and a graph was produced.  This is the</text>
<text x="22" y="448" xml:space="preserve" textLength="371.8">            common case and is not an error.</text>
<text x="22" y="488" xml:space="preserve" textLength="92.9"><tspan class="b">ENVIRONMENT</tspan></text>
<text x="22" y="508" xml:space="preserve" textLength="346.4">     <tspan class="b">HOME</tspan>   A village in Alicante, Spain.</text>
<text x="22" y="548" xml:space="preserve" textLength="219.7">     <tspan class="b">TZ</tspan>     Europe/Madrid.</text>
<text x="22" y="588" xml:space="preserve" textLength="101.4">     <tspan class="b">WEATHER</tspan></text>
<text x="22" y="608" xml:space="preserve" textLength="608.4">            Consulted before flying ultralights.  If unset, no flight is</text>
<text x="22" y="628" xml:space="preserve" textLength="185.9">            attempted.</text>
<text x="22" y="668" xml:space="preserve" textLength="42.2"><tspan class="b">FILES</tspan></text>
<text x="22" y="688" xml:space="preserve" textLength="118.3">     <tspan class="u">~/homelab</tspan></text>
<text x="22" y="708" xml:space="preserve" textLength="507.0">            A small datacenter&#x27;s worth of hardware, at home.</text>
<text x="22" y="748" xml:space="preserve" textLength="33.8"><tspan class="b">BUGS</tspan></text>
<text x="22" y="768" xml:space="preserve" textLength="380.2">     On call for everything in FILES, unpaid.</text>
<text x="22" y="808" xml:space="preserve" textLength="625.3">     The church clock next door runs about 15 seconds fast.  This has been</text>
<text x="22" y="828" xml:space="preserve" textLength="118.3">     measured.</text>
<text x="22" y="868" xml:space="preserve" textLength="67.6"><tspan class="b">SEE</tspan> <tspan class="b">ALSO</tspan></text>
<text x="22" y="888" xml:space="preserve" textLength="194.3">     https://albero.dev</text>
<text x="22" y="928" xml:space="preserve" textLength="676.0">Alicante, Spain                    2026-11-26                         LEANDRO(1)</text>
<rect x="22" y="954" width="371.8" height="18" fill="#c9d1d9"/>
<text x="22" y="968" class="inv" xml:space="preserve" textLength="371.8"> Manual page leandro(1) lines 1-44/44 (END) </text>
<rect class="cur" x="396.8" y="954" width="8.45" height="18" fill="#c9d1d9"/>
</svg>
