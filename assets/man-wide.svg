<circle cx="18" cy="17" r="5.5" fill="#ff5f57"/><circle cx="36" cy="17" r="5.5" fill="#febc2e"/><circle cx="54" cy="17" r="5.5" fill="#28c840"/>
<text x="50%" y="21" text-anchor="middle" class="title">man leandro</text>
<text x="22" y="66">LEANDRO(1)</text><text x="50%" y="66" text-anchor="middle">User Commands</text><text x="100%" dx="-22" y="66" text-anchor="end">LEANDRO(1)</text>
<text x="22" y="100" xml:space="preserve" textLength="29.0"><tspan class="b">NAME</tspan></text>
<text x="22" y="117" xml:space="preserve" textLength="347.7">     leandro - backend engineer, measures things</text>
<text x="22" y="151" xml:space="preserve" textLength="57.9"><tspan class="b">SYNOPSIS</tspan></text>
<text x="22" y="168" xml:space="preserve" textLength="166.6">     <tspan class="b">leandro</tspan> [<tspan class="u">idea</tspan> ...]</text>
<text x="22" y="202" xml:space="preserve" textLength="79.7"><tspan class="b">DESCRIPTION</tspan></text>
<text x="22" y="219" xml:space="preserve" textLength="376.6">     Writes backend code at Luzia, mostly in Python.</text>
<text x="22" y="253" xml:space="preserve" textLength="528.7">     Given an <tspan class="u">idea</tspan>, <tspan class="b">leandro</tspan> instruments it, waits a few weeks and reports</text>
<text x="22" y="270" xml:space="preserve" textLength="499.8">     whether it was worth doing.  With no arguments, adds a sensor to</text>
<text x="22" y="287" xml:space="preserve" textLength="159.3">     something nearby.</text>
<text x="22" y="321" xml:space="preserve" textLength="79.7"><tspan class="b">EXIT</tspan> <tspan class="b">STATUS</tspan></text>
<text x="22" y="338" xml:space="preserve" textLength="246.3">     <tspan class="b">0</tspan>      The idea was worth it.</text>
<text x="22" y="372" xml:space="preserve" textLength="550.5">     <tspan class="b">1</tspan>      The idea was not worth it and a graph was produced.  This is the</text>
<text x="22" y="389" xml:space="preserve" textLength="318.7">            common case and is not an error.</text>
<text x="22" y="423" xml:space="preserve" textLength="79.7"><tspan class="b">ENVIRONMENT</tspan></text>
<text x="22" y="440" xml:space="preserve" textLength="297.0">     <tspan class="b">HOME</tspan>   A village in Alicante, Spain.</text>
<text x="22" y="474" xml:space="preserve" textLength="188.3">     <tspan class="b">TZ</tspan>     Europe/Madrid.</text>
<text x="22" y="508" xml:space="preserve" textLength="86.9">     <tspan class="b">WEATHER</tspan></text>
<text x="22" y="525" xml:space="preserve" textLength="521.5">            Consulted before flying ultralights.  If unset, no flight is</text>
<text x="22" y="542" xml:space="preserve" textLength="159.3">            attempted.</text>
<text x="22" y="576" xml:space="preserve" textLength="36.2"><tspan class="b">FILES</tspan></text>
<text x="22" y="593" xml:space="preserve" textLength="101.4">     <tspan class="u">~/homelab</tspan></text>
<text x="22" y="610" xml:space="preserve" textLength="434.6">            A small datacenter&#x27;s worth of hardware, at home.</text>
<text x="22" y="644" xml:space="preserve" textLength="29.0"><tspan class="b">BUGS</tspan></text>
<text x="22" y="661" xml:space="preserve" textLength="325.9">     On call for everything in FILES, unpaid.</text>
<text x="22" y="695" xml:space="preserve" textLength="536.0">     The church clock next door runs about 15 seconds fast.  This has been</text>
<text x="22" y="712" xml:space="preserve" textLength="101.4">     measured.</text>
<text x="22" y="746" xml:space="preserve" textLength="57.9"><tspan class="b">SEE</tspan> <tspan class="b">ALSO</tspan></text>
<text x="22" y="763" xml:space="preserve" textLength="166.6">     https://albero.dev</text>
<text x="22" y="797">Alicante, Spain</text><text x="50%" y="797" text-anchor="middle">2026-11-26</text><text x="100%" dx="-22" y="797" text-anchor="end">LEANDRO(1)</text>
<rect x="22" y="819" width="318.7" height="15" fill="#c9d1d9"/>
<text x="22" y="831" class="inv" xml:space="preserve" textLength="318.7"> Manual page leandro(1) lines 1-44/44 (END) </text>
<rect class="cur" x="343.7" y="819" width="7.2" height="15" fill="#c9d1d9"/>
